[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["manifest: needs data/processed/manifest.csv (built locally from the real dataset)"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["data", "files", "checkpoints", "eda_outputs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = [
    "E501",
    "S101",  # asserts are used for sanity checks in scripts and for the leakage guard in src/data.py
    "S311",  # random is used for a reproducible split, not for security
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S301"]
